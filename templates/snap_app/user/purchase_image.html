<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Checkout</title>

    {% include 'snap_app/common/common_css.html' %}
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: radial-gradient(circle at top, #e0e7ff, #f8fafc);
        }

        .main {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .checkout-card {
            width: 100%;
            max-width: 1100px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        .header {
            padding: 18px;
            background: linear-gradient(90deg, #2563eb, #3b82f6);
            color: white;
        }

        .content {
            padding: 25px;
        }

        .image-box {
            background: #f8fafc;
            border-radius: 16px;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .preview-img {
            width: 100%;
            max-height: 420px;
            object-fit: contain;
            border-radius: 12px;
        }

        .payment-box {
            background: #f9fafb;
            border-radius: 16px;
            padding: 20px;
        }

        #qrcode {
            display: flex;
            justify-content: center;
            padding: 10px;
            background: white;
            border-radius: 12px;
            margin: 10px 0;
        }

        .btn-primary, .btn-dark, .btn-success {
            border-radius: 10px;
        }
    </style>
</head>

<body>
{% include 'snap_app/user/user_header.html' %}
<div class="main" style="margin-top:1%;"> 

    <div class="checkout-card">

        <!-- HEADER -->
        <div class="header">
            <h4 class="mb-0">🔒 Secure Checkout</h4>
            <small>Complete payment to unlock image</small>
        </div>

        <div class="content">

            <div class="row g-4">

                <!-- IMAGE -->
                <div class="col-md-6">

                    <div class="image-box">
                        <img src="/media/{{pic_key.image}}" class="preview-img">
                    </div>

                    {% if show_btn %}
                    <div class="text-center mt-3">
                        <a href="/media/{{pic_key.image}}" download="{{pic_key.image}}">
                            <button class="btn btn-success"
                                {% if payment_obj.payment_status == "pending" %}
                                disabled style="opacity:0.5;cursor:not-allowed;"
                                {% endif %}>
                                Download Image
                            </button>
                        </a>
                    </div>
                    {% endif %}

                </div>

                <!-- PAYMENT -->
                <div class="col-md-6">

                    <div class="payment-box">

                        <form method="POST" action="/purchase_image/{{pic_key.id}}">
                            {% csrf_token %}

                            <input type="hidden" name="photgrapher_email" value="{{pic_key.photographer.email}}">
                            <input type="hidden" name="photo_id" value="{{pic_key.id}}">

                            <!-- AMOUNT -->
                            <div class="mb-3">
                                <label class="form-label">Amount</label>
                                <input type="text" class="form-control" readonly value="{{pic_key.price}}">
                            </div>

                            <!-- QR -->
                            <button type="button" class="btn btn-primary w-100"
                                    onclick="GenerateQrCode()">
                                Generate QR Code
                            </button>

                            <div id="qrcode" class="mt-3"></div>

                            <!-- TRANSACTION -->
                            <div class="mt-3">
                                <label class="form-label">Transaction ID</label>
                                <input type="text" class="form-control"
                                       name="transaction_id"
                                       placeholder="Enter Transaction ID" required>
                            </div>

                            <!-- SUBMIT -->
                            <button type="submit" class="btn btn-dark w-100 mt-3"
                                    onclick="refrespage()">
                                Confirm Payment
                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<script>
function GenerateQrCode() {
    document.getElementById("qrcode").innerHTML = "";
    new QRCode(document.getElementById("qrcode"), {
        text: "{{upi_link |safe}}",
        width: 180,
        height: 180
    });
}

function refrespage(){
    setTimeout(() => {
        window.location.reload();
    }, 3000);
}
</script>

{% include 'snap_app/common/footer.html' %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
