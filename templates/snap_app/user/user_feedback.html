<!DOCTYPE html>
{% load static %}
<html>

<head>
<title>Feedback Form</title>

{% include 'snap_app/common/common_css.html' %}
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

body{
font-family:'Poppins',sans-serif;
background:linear-gradient(135deg,#f0f4ff,#eef2ff,#f8fafc);
overflow-x:hidden;
}

/* ===== MAIN LAYOUT ===== */
.main{
display:flex;
justify-content:center;
align-items:center;
margin-top:70px;
gap:70px;
flex-wrap:wrap;
}

/* ===== CARD ===== */
.feedback-container{
width:480px;
background:rgba(255,255,255,0.85);
backdrop-filter:blur(15px);
padding:40px;
border-radius:25px;
box-shadow:0 25px 60px rgba(37,99,235,.15);
animation:fadeUp 1s ease;
}

/* ===== TITLE ===== */
.feedback-container h2{
text-align:center;
font-weight:800;
font-size:30px;
background:linear-gradient(90deg,#2563eb,#7c3aed);

margin-bottom:25px;
}

/* ===== TEXTAREA ===== */
textarea{
width:100%;
height:130px;
padding:14px;
margin-top:10px;
border-radius:12px;
border:1px solid #e5e7eb;
transition:.3s;
font-size:15px;
}

textarea:focus{
border-color:#2563eb;
box-shadow:0 0 10px rgba(37,99,235,.25);
outline:none;
}

/* ===== STARS ===== */
.stars{
text-align:center;
margin:30px 0;
direction:rtl;
}

.stars input{
display:none;
}

.stars label{
font-size:36px;
color:#d1d5db;
cursor:pointer;
transition:.3s;
}

.stars label:hover,
.stars label:hover ~ label{
color:#f59e0b;
transform:scale(1.2);
}

.stars input:checked ~ label{
color:#fbbf24;
}

/* ===== BUTTON ===== */
.submit{
width:100%;
padding:14px;
background:linear-gradient(90deg,#2563eb,#7c3aed);
color:white;
border:none;
border-radius:40px;
cursor:pointer;
font-size:17px;
font-weight:600;
transition:.3s;
box-shadow:0 15px 35px rgba(37,99,235,.2);
}

.submit:hover{
transform:translateY(-3px);
}

/* ===== IMAGE ===== */
.image{
text-align:center;
animation:floatImg 5s ease-in-out infinite;
}

.image img{
width:420px;
max-width:100%;
}

/* ===== ALERT ===== */
.alert{
border-radius:14px;
box-shadow:0 10px 25px rgba(0,0,0,.1);
}

/* ===== ANIMATION ===== */
@keyframes floatImg{
0%{transform:translateY(0);}
50%{transform:translateY(-15px);}
100%{transform:translateY(0);}
}

@keyframes fadeUp{
from{
opacity:0;
transform:translateY(40px);
}
to{
opacity:1;
transform:translateY(0);
}
}

/* ===== RESPONSIVE ===== */
@media(max-width:992px){

.main{
flex-direction:column;
gap:40px;
}

.image img{
width:320px;
}

.feedback-container{
width:100%;
max-width:420px;
}
}

</style>

</head>

<body>

{% include 'snap_app/user/user_header.html' %}

{% for msg in messages %}
<div class="alert alert-success alert-dismissible fade show"
role="alert"
style="width:500px;margin:auto;margin-top:30px;">

<strong>{{msg}}</strong>

<button type="button"
class="btn-close"
data-bs-dismiss="alert">
</button>

</div>
{% endfor %}

<div class="main">

<div class="feedback-container">

<h2 style="color: white;">💬 Feedback Form</h2>

<form novalidate
class="needs-validation"
method="POST"
action="/user_feedback/">

{% csrf_token %}

<label><b>Write your Review:</b></label>

<textarea
placeholder="Enter your feedback here..."
required
name="review">
</textarea>

<div class="invalid-feedback">
Please Enter your Feedback Here
</div>

<div class="stars">

<input type="radio" id="star5" name="rating" value="⭐⭐⭐⭐⭐">
<label for="star5">★</label>

<input type="radio" id="star4" name="rating" value="⭐⭐⭐⭐">
<label for="star4">★</label>

<input type="radio" id="star3" name="rating" value="⭐⭐⭐">
<label for="star3">★</label>

<input type="radio" id="star2" name="rating" value="⭐⭐">
<label for="star2">★</label>

<input type="radio" id="star1" name="rating" value="⭐">
<label for="star1">★</label>

</div>

<button class="submit" type="submit">
Submit Feedback
</button>

</form>

</div>



</div>

{% include 'snap_app/common/footer.html' %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'snap_app/js/custom_validation.js' %}"></script>

</body>
</html>
