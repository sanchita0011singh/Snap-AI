{% load static %}

<style>

/* NAVBAR */
.navbar{
background:rgba(255,255,255,.96);
backdrop-filter:blur(10px);
height:75px;
border:1px solid #ffffff;
box-shadow:0 8px 20px rgba(0,0,0,.08);
position:relative;
z-index:9999;
overflow:visible !important;
}

/* CONTAINER */
.navbar .container-fluid{
overflow:visible !important;
}

/* LOGO */
.navbar-brand img{
height:135px;
width:auto;
margin-top:-18px;
}

/* NAV ITEMS */
.navbar-nav .nav-item{
margin:0 6px;
position:relative;
}

/* LINKS */
.navbar-nav .nav-link{
color:#111 !important;
font-size:19px;
font-family:'Gill Sans','Gill Sans MT',Calibri,'Trebuchet MS',sans-serif;
font-weight:700;
padding:10px 18px !important;
border-radius:12px;
transition:all .3s ease;
position:relative;
}

/* HOVER */
.navbar-nav .nav-link:hover{
background:linear-gradient(135deg,#6a11cb,#2575fc);
color:#fff !important;
transform:translateY(-2px);
box-shadow:0 10px 20px rgba(37,117,252,.18);
}

/* UNDERLINE */
.navbar-nav .nav-link::after{
content:'';
position:absolute;
left:18px;
bottom:6px;
width:0%;
height:2px;
background:#fff;
transition:.3s;
border-radius:10px;
}

.navbar-nav .nav-link:hover::after{
width:55%;
}

/* DROPDOWN FIX */
.dropdown{
position:relative;
}

.dropdown-menu{
position:absolute !important;
top:115% !important;
left:0 !important;
z-index:99999 !important;
border:none;
border-radius:14px;
padding:10px 0;
min-width:230px;
background:linear-gradient(135deg,#6a11cb,#2575fc);
box-shadow:0 18px 30px rgba(0,0,0,.18);
animation:fadeIn .3s ease;
overflow:visible !important;
}

/* ARROW */
.dropdown-menu::before{
content:'';
position:absolute;
top:-6px;
left:26px;
width:12px;
height:12px;
background:#6a11cb;
transform:rotate(45deg);
}

/* DROPDOWN ITEMS */
.dropdown-menu a{
color:#fff !important;
padding:12px 20px;
font-weight:600;
display:block;
transition:.3s;
}

.dropdown-menu a:hover{
background:rgba(255,255,255,.14);
padding-left:28px;
border-radius:8px;
}

/* HELP DESK */
.help_desk{
margin-right:10px;
}

.help_desk .nav-link{
background:linear-gradient(135deg,#ff6a00,#ee0979);
color:#fff !important;
padding:11px 24px !important;
border-radius:35px;
font-size:18px;
font-weight:700;
box-shadow:0 10px 20px rgba(238,9,121,.25);
}

.help_desk .nav-link:hover{
transform:translateY(-3px) scale(1.04);
color:#fff !important;
}

/* MOBILE */
.navbar-collapse{
overflow:visible !important;
}

/* ANIMATION */
@keyframes fadeIn{
from{
opacity:0;
transform:translateY(12px);
}
to{
opacity:1;
transform:translateY(0);
}
}

body{
overflow-x:hidden;
}

</style>

<nav class="navbar navbar-expand-lg">

<div class="container-fluid">

<a class="navbar-brand" href="/">
<img src="{% static 'snap_app/image/logo4.png' %}" alt="">
</a>

<button class="navbar-toggler"
type="button"
data-bs-toggle="collapse"
data-bs-target="#navbarSupportedContent"
aria-controls="navbarSupportedContent"
aria-expanded="false"
aria-label="Toggle navigation">

<span class="navbar-toggler-icon"></span>

</button>

<div class="collapse navbar-collapse" id="navbarSupportedContent">

<ul class="navbar-nav me-auto mb-2 mb-lg-0">

<li class="nav-item">
<a class="nav-link" href="/about/">About Us</a>
</li>

<li class="nav-item">
<a class="nav-link" href="/contact/">Contact Us</a>
</li>

<li class="nav-item dropdown">
<a class="nav-link dropdown-toggle"
href="#"
role="button"
data-bs-toggle="dropdown"
aria-expanded="false">
Registration
</a>

<ul class="dropdown-menu">
<li><a class="dropdown-item" href="/photographer_registration/">Register as Photographer</a></li>
<li><a class="dropdown-item" href="/user_registration/">Register as User</a></li>
</ul>
</li>

<li class="nav-item dropdown">
<a class="nav-link dropdown-toggle"
href="#"
role="button"
data-bs-toggle="dropdown"
aria-expanded="false">
Login
</a>

<ul class="dropdown-menu">
<li><a class="dropdown-item" href="/photographer_login/">Login as Photographer</a></li>
<li><a class="dropdown-item" href="/userlogin/">Login as User</a></li>
</ul>
</li>

</ul>

<div class="help_desk">
<a class="nav-link" href="/help_desk/">💬 Help Desk</a>
</div>

</div>

</div>

</nav>
