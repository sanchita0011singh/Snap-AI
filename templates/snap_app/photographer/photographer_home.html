<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Photographer Home</title>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
{% include 'snap_app/common/common_css.html' %}

<style>

.main{

background:linear-gradient(135deg,#f1f5f9,#e0e7ff,#f8fafc);
min-height:100vh;
padding-top:60px;

}

.section-title{

text-align:center;
font-weight:700;
font-size:38px;
color:#4338ca;
margin-bottom:60px;

}

.flex-container{

display:flex;
justify-content:center;
align-items:center;
gap:120px;

}

/* profile image */

.img-div{

width:270px;
height:270px;
border-radius:50%;
border:6px solid #6366f1;
box-shadow:0 25px 50px rgba(0,0,0,0.12);
background:white;
padding:10px;
transition:.4s;

}

.img-div:hover{

transform:scale(1.05);

}

.img-div img{

width:100%;
height:100%;
border-radius:50%;
object-fit:cover;

}

/* card */

.conatin-div{

width:470px;
border-radius:25px;
background:white;
padding:45px;
box-shadow:0 25px 50px rgba(0,0,0,0.08);
border:1px solid #e5e7eb;

}

/* profile rows */

.profile-row{

display:flex;
justify-content:space-between;
align-items:center;
padding:14px 0;
border-bottom:1px solid #eef2f7;

}

.label{

font-size:16px;
font-weight:600;
color:#6b7280;

}

.value{

font-size:18px;
font-weight:700;
color:#111827;

}

/* email highlight */

.email-row{

background:#eef2ff;
padding:15px;
border-radius:12px;
margin-bottom:15px;
border:none;

}

/* button */

.edit-btn{

margin-top:30px;
width:100%;
background:linear-gradient(45deg,#3b82f6,#6366f1);
border:none;
color:white;
padding:13px;
border-radius:30px;
font-size:17px;
font-weight:600;
transition:.3s;

}

.edit-btn:hover{

background:linear-gradient(45deg,#4338ca,#3730a3);
transform:scale(1.05);

}

</style>

</head>

<body>

{% include 'snap_app/photographer/photographer_header.html' %}

<div class="main">

<h2 class="section-title">

Photographer Profile

</h2>

<div class="flex-container">

<div class="img-div">

<img src="/media/{{p_key.profile_pic}}" alt="">

</div>

<div class="conatin-div">

<!-- Email sabse upar -->

<div class="profile-row email-row">

<div class="label">Email</div>

<div class="value">{{p_key.email}}</div>

</div>

<div class="profile-row">

<div class="label">Name</div>

<div class="value">{{p_key.name}}</div>

</div>

<div class="profile-row">

<div class="label">Phone</div>

<div class="value">{{p_key.phone}}</div>

</div>

<div class="profile-row" style="border:none;">

<div class="label">City</div>

<div class="value">{{p_key.city}}</div>

</div>

<a href="/p_edit_profile/">

<button class="edit-btn">

Edit Profile

</button>

</a>

</div>

</div>

</div>

{% include 'snap_app/common/footer.html' %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
