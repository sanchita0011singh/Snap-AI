<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UPI Details</title>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
{% include 'snap_app/common/common_css.html' %}

<style>

.main{

display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
background:linear-gradient(135deg,#eef2ff,#f8fafc);

}

/* card */

.box{

width:420px;
padding:45px;
border-radius:20px;
background:white;
box-shadow:0 20px 40px rgba(0,0,0,0.08);
border:1px solid #e5e7eb;

}

/* title */

.title{

text-align:center;
color:white;
background:linear-gradient(45deg,#3b82f6,#6366f1);
padding:12px;
border-radius:10px;
font-weight:600;
margin-bottom:30px;

}

/* form area */

.upid{

margin-top:25px;

}

.upid label{

font-weight:600;
color:#374151;
margin-bottom:6px;

}

.upid input{

width:100%;
border-radius:8px;
border:1px solid #d1d5db;
padding:10px;
transition:.3s;

}

.upid input:focus{

outline:none;
border:1px solid #6366f1;
box-shadow:0 0 5px rgba(99,102,241,.4);

}

/* button */

.button{

margin-top:35px;
text-align:center;

}

.button button{

width:100%;
background:linear-gradient(45deg,#22c55e,#16a34a);
border:none;
padding:12px;
font-size:16px;
border-radius:25px;
transition:.3s;

}

.button button:hover{

background:linear-gradient(45deg,#16a34a,#15803d);
transform:scale(1.03);

}

</style>

</head>

<body>

{% include 'snap_app/photographer/photographer_header.html' %}

<div class="main">

<div class="box">

<form method="POST" action="/photographer_UPI/">

{% csrf_token %}

<h2 class="title">

<i class="fa-solid fa-money-check-dollar"></i>
 Photographer UPI Details

</h2>

<div class="upid">

<label>UPI ID</label>

<input type="text"
placeholder="Enter UPI ID"
name="UPI-ID"
class="form-control">

</div>

<div class="button">

<button class="btn btn-success">

<i class="fa-solid fa-paper-plane me-2"></i>
Submit

</button>

</div>

</form>

</div>

</div>

{% include 'snap_app/common/footer.html' %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
