<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Photographer Login</title>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

{% include 'snap_app/common/common_css.html' %}

<style>

html,body{
height:100%;
margin:0;
padding:0;
}

/* Background */
body{
background: linear-gradient(135deg,#ffffff,#eef2ff,#f8fafc);
font-family:Arial, Helvetica, sans-serif;
}

/* Center Form */
.flex-container{
display:flex;
justify-content:center;
align-items:center;
margin-top:40px;
margin-bottom:40px;
}

/* Login Card */
.context{
width:420px;
padding:30px;
background:white;
border-radius:18px;
box-shadow:0 15px 35px rgba(0,0,0,0.08);
text-align:center;
transition:0.3s;
}

.context:hover{
transform:translateY(-3px);
}

/* Image */
.image-div{
display:flex;
justify-content:center;
margin-bottom:10px;
}

.image-div img{
width:240px;
height:auto;
}

/* Title */
.form-title{
font-size:24px;
font-weight:700;
margin-bottom:20px;
color:#4f46e5;
}

/* Input Icons */
.input-group-text{
background:#f3f4f6;
border:1px solid #e5e7eb;
color:#6366f1;
border-top-left-radius:12px;
border-bottom-left-radius:12px;
}

/* Input Box */
.form-control{
border:1px solid #e5e7eb;
border-top-right-radius:12px;
border-bottom-right-radius:12px;
padding:12px;
transition:0.3s;
}

/* Input Focus */
.form-control:focus{
border-color:#6366f1;
box-shadow:0 0 10px rgba(99,102,241,0.25);
}

/* Button */
.btn-login{
background:linear-gradient(45deg,#3b82f6,#6366f1);
border:none;
border-radius:30px;
padding:12px 35px;
color:white;
font-weight:600;
font-size:16px;
transition:0.3s;
width:100%;
}

.btn-login:hover{
transform:scale(1.03);
box-shadow:0 10px 18px rgba(99,102,241,0.25);
}

/* Forgot */
.extra-link{
margin-top:15px;
font-size:14px;
}

.extra-link a{
text-decoration:none;
color:#4f46e5;
font-weight:600;
}

.extra-link a:hover{
text-decoration:underline;
}

</style>
</head>

<body>

<!-- Header -->
{% include 'snap_app/common/header.html' %}

<!-- Django Messages with Sweet Alert -->
{% for msg in messages %}
<script>
Swal.fire({
icon:'error',
title:'Login Failed',
text:'{{ msg }}',
confirmButtonColor:'#6366f1'
});
</script>
{% endfor %}

<div class="flex-container">

<div class="context">

<!-- Image -->
<div class="image-div">
<img src="{% static 'snap_app/image/p login.png' %}">
</div>

<div class="form-title">
Photographer Login
</div>

<form action="/photographer_login/" method="post" class="needs-validation" novalidate>

{% csrf_token %}

<!-- Email -->
<div class="input-group mb-3">

<span class="input-group-text">
<i class="fa-solid fa-envelope"></i>
</span>

<input type="email"
class="form-control"
placeholder="Enter Your Email"
name="email"
required>

<div class="invalid-feedback">
Please Enter your Email
</div>

</div>

<!-- Password -->
<div class="input-group mb-4">

<span class="input-group-text">
<i class="fa-solid fa-lock"></i>
</span>

<input type="password"
class="form-control"
placeholder="Enter Your Password"
name="password"
required>

<div class="invalid-feedback">
Please Enter your Password
</div>

</div>

<!-- Button -->
<div class="text-center">
<button class="btn btn-login" type="submit">
Login
</button>
</div>

<!-- <div class="extra-link">
<a href="#">Forgot Password?</a>
</div> -->

</form>

</div>

</div>

<!-- Footer -->
{% include 'snap_app/common/footer.html' %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'snap_app/js/custom_validation.js' %}"></script>

<script>
/* Success popup on submit */
document.querySelector("form").addEventListener("submit", function(e){

if(this.checkValidity()){
Swal.fire({
title:'Please Wait...',
text:'Logging in...',
icon:'info',
showConfirmButton:false,
timer:1200
});
}

});
</script>

</body>
</html>
