<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload_photos</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    {%  include 'snap_app/common/common_css.html' %}
    <style>

body{
background:#f5f5f5;
}

.upload-card{
max-width:600px;
margin:auto;
margin-top:60px;
padding:30px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
background:white;
}

        
</style>
<script>
         //check digits


function checkDigit(event)
{
    let data = event.target.value
    event.target.value = data.replace(/[^0-9.]/g,'')


}

function amount(paymentType)
{
    if(paymentType=="paid")
    {
        document.getElementById("divAmount").style.display="block"; // show
    }

    if(paymentType=="free")
    {
        document.getElementById("divAmount").style.display="none"; // hide
    }
}
</script>
    
</head>
<body>
    {% include 'snap_app/photographer/photographer_header.html' %}
    <div class="main">
    <div class="container">

<div class="upload-card">

<h4 class="text-center mb-4" style="background-color: rgb(8, 8, 139); color: #ffffff; height: auto;">Upload Photos</h4>

<form method="POST" action="/upload_photos/" enctype="multipart/form-data"novalidate class="needs-validation" >
    {% csrf_token %}



<!-- Category -->
<div class="mb-3">
<label class="form-label">Category</label>
<div class="input-group">
<span class="input-group-text"><i class="fa-solid fa-layer-group"></i></span>
<select class="form-select" name="category">
<option value="def">Select Category</option>
{% for ct in ct_key %}
<option   value="{{ct.name}}">{{ct.name}}</option>
{% endfor %}
</select>
</div>
</div>

<!-- Title -->
<div class="mb-3">
<label class="form-label">Title</label>
<div class="input-group">
<span class="input-group-text"><i class="fa-solid fa-heading"></i> </span>
<input type="text" class="form-control" name="title" placeholder="Enter photo title">
</div>
</div>

<!-- Image -->
<div class="mb-3">
<label class="form-label">Upload Image</label>
<div class="input-group">
<span class="input-group-text"><i class="fa-solid fa-image"></i></span>
<input type="file" class="form-control" name="photo" required>
</div>
</div>

<!-- Price Type -->
<div class="mb-3">
<label class="form-label">Price Type</label>
<div class="input-group">
<span class="input-group-text"><i class="fa-solid fa-image"></i></span>
<select class="form-select" name="price_type" onchange="amount(this.value)" required>
<option value="free">Select Type</option>
<option value="free">Free</option>
<option value="paid">Paid</option>
</select>
</div>
</div>

<!-- Price -->
<div class="mb-3" id="divAmount" style="display: none;">
<label class="form-label"></i>Price</label>
<div class="input-group">
<span class="input-group-text"><i class="fa-solid fa-indian-rupee-sign"></i></span>
<input type="text" class="form-control" name="price" oninput="checkDigit(event)" value="00.0" placeholder="Enter amount">
</div>
</div>

<!-- Description -->
<div class="mb-3">
<label class="form-label">Description</label>
<div class="input-group">
<span class="input-group-text"><i class="fa-solid fa-file-lines"></i></span>
<textarea class="form-control" rows="3" name="description"></textarea>
</div>
</div>

<!-- Button -->
<div class="text-center">
<button type="submit"class="btn btn-primary w-100" style="width: 100%;">Upload Photo</button>
</div>

</form>

</div>

</div>

</div>
       
        </div>
        
 {% include 'snap_app/common/footer.html'  %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="{% static 'snap_app/js/custom_validation.js' %}"></script>
</body>
</html>
